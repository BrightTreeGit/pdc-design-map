<title>Bright Tree Design Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height map with a docked side panel (bottom sheet on phones). Survey-sheet feel: condensed labels, mono readouts. */
:root{
  --bg:#eef0ea; --panel:#f8f9f5; --ink:#1d2621; --muted:#5d6a62; --line:#d3d9d0; --chip:#e4e9e1;
  --accent:#1f6a57; --accent-ink:#ffffff; --warn:#b4471f; --ok:#2c7a3f; --mapbg:#dfe3da;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1b2320; --ink:#e3e9e4; --muted:#9aa89f; --line:#2f3a35; --chip:#26302c;
  --accent:#5fbf9f; --accent-ink:#0d1714; --warn:#f08a5d; --ok:#7ccf8d; --mapbg:#202825; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1b2320; --ink:#e3e9e4; --muted:#9aa89f; --line:#2f3a35; --chip:#26302c;
  --accent:#5fbf9f; --accent-ink:#0d1714; --warn:#f08a5d; --ok:#7ccf8d; --mapbg:#202825; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
header.brand{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
.brand .sub{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.hdrrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.hdrrow .sync{margin-top:0}
.btn.fb{font-size:12.5px;padding:4px 10px;border-color:var(--accent);color:var(--accent);background:transparent}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--warn)}
nav.tabs{display:flex;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{flex:1;overflow:auto;padding:12px 16px 24px;min-height:0}
h2{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
h2:first-child{margin-top:4px}
.row{display:flex;align-items:center;gap:8px;padding:5px 0}
.row label{flex:1;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.row input[type=range]{width:90px;flex:none}
.swatch{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);padding:2px 0 6px 22px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn:focus-visible,.seg button:focus-visible,.tool:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 8px;cursor:pointer;min-width:0}
.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--chip)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:2px;display:flex;overflow:hidden;margin:6px 0}
.flist button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.flist button:hover{background:var(--chip)}
.flist .meta{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.pill{font-size:10.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:9px;background:var(--chip);color:var(--muted)}
.pill.agreed{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.pill.built{background:var(--accent);color:var(--accent-ink)}
.pill.proposed{background:color-mix(in srgb,#d9a227 25%,transparent);color:#a77700}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.field textarea{min-height:80px;resize:vertical}
canvas#profile{width:100%;height:110px;display:block;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--mapbg);overflow:hidden}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#map.drawing{cursor:crosshair}
.hud{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;font-variant-numeric:tabular-nums;pointer-events:none;max-width:calc(100% - 140px)}
.hud b{font-weight:500;color:var(--ink)} .hud{color:var(--muted)}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;font-size:18px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.drawbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:calc(100% - 80px)}
.drawbar .what{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;padding:0 4px}
.drawbar .gp{display:flex;align-items:center;gap:4px;font-size:12.5px}
.drawbar input[type=number]{width:52px;font:inherit;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.maplegend{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11.5px;max-width:min(260px,calc(100% - 80px));box-shadow:0 2px 10px rgba(0,0,0,.12)}
.maplegend b{display:block;font-family:var(--f-display);font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.maplegend .grad{height:10px;border-radius:2px;margin:2px 0}
.maplegend .ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.maplegend .legend{padding:0}
.toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%}
.toast.show{opacity:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.5;color:var(--muted)}
.empty ol{margin:6px 0 0 18px;padding:0}
.kpl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 0;font:inherit;color:var(--ink);cursor:pointer}
.kpl small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #mapwrap{grid-row:1}
  #panel{grid-row:2;border-right:0;border-top:1px solid var(--line);max-height:46vh}
  #panel.min .tabbody{display:none}
  header.brand{padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:20px} .brand .sub{display:none} .sync{margin-top:0}
  .tabbody{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .hud{bottom:10px;font-size:10.5px}
  .drawbar{max-width:calc(100% - 70px);left:calc(8px + env(safe-area-inset-left,0px));transform:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div id="app">
  <aside id="panel">
    <header class="brand">
      <h1>Bright Tree Design Map</h1>
      <div class="sub">Sunshine Coast hinterland · LiDAR 2022, 1 m</div>
      <div class="hdrrow"><div class="sync" id="sync"><i></i><span>Connecting…</span></div><button class="btn fb" id="fbBtn" hidden title="Comment on the map for the map owner">Send feedback</button></div>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" id="t-layers" aria-selected="true" data-tab="layers">Layers</button>
      <button role="tab" id="t-draw" aria-selected="false" data-tab="draw">Draw</button>
      <button role="tab" id="t-feat" aria-selected="false" data-tab="feat">Design</button>
      <button role="tab" id="t-site" aria-selected="false" data-tab="site">Site</button>
    </nav>
    <div class="tabbody" id="tab-layers"></div>
    <div class="tabbody" id="tab-draw" hidden></div>
    <div class="tabbody" id="tab-feat" hidden></div>
    <div class="tabbody" id="tab-site" hidden></div>
  </aside>
  <main id="mapwrap">
    <canvas id="map" aria-label="Terrain and design map of Bright Tree"></canvas>
    <div class="loading" id="loading">Loading LiDAR terrain…</div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Zoom to the lot" title="Zoom to the lot">⌂</button>
    </div>
    <div class="drawbar" id="drawbar" hidden></div>
    <div class="maplegend" id="mapLegend" hidden></div>
    <div class="hud" id="hud">Move over the map for elevation, slope and sun</div>
    <div class="toast" id="toast"></div>
  </main>
</div>

<script>
"use strict";
/* ---------------- constants ---------------- */
const E0=492000, N0=7043000; // local x = E - E0, y = N0 - N  (GDA2020 / MGA zone 56)
const LAT=-26.7435;
const KINDS={
  zone0:{g:'Zones',label:'Zone 0 · Home',geom:'polygon',color:'#7d5aa6'},
  zone1:{g:'Zones',label:'Zone 1 · Daily',geom:'polygon',color:'#d6453d'},
  zone2:{g:'Zones',label:'Zone 2 · Orchard',geom:'polygon',color:'#e8862a'},
  zone3:{g:'Zones',label:'Zone 3 · Broadacre',geom:'polygon',color:'#d9b81f'},
  zone4:{g:'Zones',label:'Zone 4 · Managed bush',geom:'polygon',color:'#7cab3a'},
  zone5:{g:'Zones',label:'Zone 5 · Wild',geom:'polygon',color:'#2f7a46'},
  sunW:{g:'Sectors',label:'Winter sun 21 Jun',geom:'sun',decl:23.44,color:'#e0a400'},
  sunS:{g:'Sectors',label:'Summer sun 21 Dec',geom:'sun',decl:-23.44,color:'#e2572b'},
  fire:{g:'Sectors',label:'Fire sector',geom:'sector',color:'#c0311f'},
  wind:{g:'Sectors',label:'Wind sector',geom:'sector',color:'#4f86b8'},
  coldair:{g:'Sectors',label:'Cold air flow',geom:'line',color:'#5aa0e6',arrow:true},
  view:{g:'Sectors',label:'View / noise',geom:'sector',color:'#8a6fb0'},
  tank:{g:'Water',label:'Tank',geom:'point',color:'#1d6fb8',sym:'tank'},
  pond:{g:'Water',label:'Pond / dam',geom:'polygon',color:'#2d8fd5'},
  swale:{g:'Water',label:'Swale (level)',geom:'line',color:'#1aa3c7',grade:0},
  diversion:{g:'Water',label:'Diversion drain',geom:'line',color:'#3b7fd9',grade:1},
  keypoint:{g:'Water',label:'Keypoint',geom:'point',color:'#0b5c8f',sym:'diamond'},
  flow:{g:'Water',label:'Water flow',geom:'line',color:'#2878c8',arrow:true},
  pipe:{g:'Water',label:'Pipe / hose',geom:'line',color:'#5c6f80',dash:[6,4]},
  track:{g:'Access',label:'Track (≤10%)',geom:'line',color:'#8a5a2b',grade:8,checkGrade:10},
  path:{g:'Access',label:'Footpath',geom:'line',color:'#a8794a',dash:[3,3],checkGrade:15},
  building:{g:'Built',label:'Building',geom:'polygon',color:'#575757'},
  structure:{g:'Built',label:'Structure / asset',geom:'point',color:'#444',sym:'square'},
  foodforest:{g:'Plants',label:'Food forest / bed',geom:'polygon',color:'#5f9e2f'},
  guild:{g:'Plants',label:'Guild',geom:'point',color:'#3f8f3a',sym:'guild'},
  tree:{g:'Plants',label:'Tree',geom:'point',color:'#2e6b2a',sym:'tree'},
  row:{g:'Plants',label:'Planting row',geom:'line',color:'#4e9a3c',grade:0},
  futurebuilding:{g:'Built',label:'Future building',geom:'polygon',color:'#6b6b6b',dash:[5,4]},
  bed:{g:'Landscape',label:'Garden bed',geom:'polygon',color:'#9a7420'},
  lawn:{g:'Landscape',label:'Lawn / open space',geom:'polygon',color:'#7fb24a'},
  paving:{g:'Landscape',label:'Deck / paving',geom:'polygon',color:'#8d8d8d'},
  animals:{g:'Landscape',label:'Animal area',geom:'polygon',color:'#b06f3c'},
  hedge:{g:'Landscape',label:'Hedgerow / windbreak',geom:'line',color:'#3b7a3a',w:6},
  fence:{g:'Landscape',label:'Fence',geom:'line',color:'#6d5a4b',dash:[8,3]},
  gathering:{g:'Landscape',label:'Gathering / fire pit',geom:'point',color:'#d0682f',sym:'circle'},
  compost:{g:'Landscape',label:'Compost / nursery',geom:'point',color:'#7a5c2e',sym:'square'},
  note:{g:'Notes',label:'Note',geom:'point',color:'#b0306a',sym:'pin'},
};
const STATUS=['idea','proposed','agreed','built'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------------- projection (Krüger, GRS80, MGA56) ---------------- */
const PJ=(()=>{const a=6378137,f=1/298.257222101,k0=.9996,lon0=153*Math.PI/180,FE=5e5,FN=1e7;
 const n=f/(2-f),A=a/(1+n)*(1+n*n/4+n**4/64),e=Math.sqrt(f*(2-f));
 const al=[n/2-2*n*n/3+5*n**3/16,13*n*n/48-3*n**3/5,61*n**3/240],be=[n/2-2*n*n/3+37*n**3/96,n*n/48+n**3/15,17*n**3/480];
 function toLL(E,N){const xi=(N-FN)/(k0*A),eta=(E-FE)/(k0*A);let xp=xi,ep=eta;
  for(let j=0;j<3;j++){const k=2*(j+1);xp-=be[j]*Math.sin(k*xi)*Math.cosh(k*eta);ep-=be[j]*Math.cos(k*xi)*Math.sinh(k*eta)}
  const chi=Math.asin(Math.sin(xp)/Math.cosh(ep));let lat=chi;
  for(let i=0;i<6;i++)lat=Math.asin(Math.tanh(Math.atanh(Math.sin(chi))+e*Math.atanh(e*Math.sin(lat))));
  return [(lon0+Math.atan2(Math.sinh(ep),Math.cos(xp)))*180/Math.PI,lat*180/Math.PI]}
 return {toLL}})();
const xy2ll=(x,y)=>PJ.toLL(x+E0,N0-y);

/* ---------------- state ---------------- */
let T=null; const IMG={};
let dem2=null, dem1=null, sunGrid={};
const view={cx:960,cy:960,s:1};
const layers=Object.assign({base:'relief',baseOp:1,overlay:'none',ovOp:0.7,c1:true,c5:true,streams:true,catch:true,kp:true,lot:true,design:true,labels:true},lsGet('bt.layers',{}));
const features=new Map(); // id -> data
let selected=null, tool=null, draft=null, gradePen=lsGet('bt.gradePen',{on:false,grade:0,dir:'down'});
let db=null, userCap=null, myId=null, downloads=null, live=false, assets=null;
let penMode=lsGet('bt.penMode',matchMedia('(pointer:coarse)').matches?'snap':'off'), freeStroke=null;
const imagery=new Map(); const IMGX={}; let align=null, imgDrag=null;

/* ---------------- data loading ---------------- */
async function inflate(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const s=new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));return await new Response(s).arrayBuffer()}
function loadImg(k,src){return new Promise(r=>{const im=new Image();im.onload=()=>{IMG[k]=im;r()};im.onerror=()=>r();im.src=src})}
async function boot(){
  resize(); fitLot(); draw();
  const imgs=['relief.jpg','hillshade.jpg','slope.png','aspect.png','cold.png','sun_winter.png','sun_equinox.png','sun_summer.png'];
  const pImgs=Promise.all(imgs.map(f=>loadImg(f.split('.')[0],f)));
  try{T=await (await fetch('terrain.json')).json()}catch(e){$('#loading').textContent='Terrain data did not load. Reload the page to try again.';return}
  buildPaths(); fitLot();
  dem2=new Int16Array(await inflate(T.meta.dem.b64));
  const d1=T.meta.dem1; dem1={x0:d1.x0,y0:d1.y0,w:d1.w,h:d1.h,a:new Int16Array(await inflate(d1.b64))};
  for(const k of ['winter','equinox','summer']) sunGrid[k]=new Uint8Array(await inflate(T.meta['sunh_'+k]));
  await pImgs; $('#loading').hidden=true;
  renderLayers(); renderDraw(); renderFeatures(); renderSite(); draw();
  connect();
}

/* ---------------- terrain queries ---------------- */
function zAt(x,y){
  if(dem1){const u=x-dem1.x0-.5,v=y-dem1.y0-.5;if(u>=0&&v>=0&&u<dem1.w-1&&v<dem1.h-1){const i=u|0,j=v|0,fx=u-i,fy=v-j,w=dem1.w,a=dem1.a;
    return ((a[j*w+i]*(1-fx)+a[j*w+i+1]*fx)*(1-fy)+(a[(j+1)*w+i]*(1-fx)+a[(j+1)*w+i+1]*fx)*fy)/10}}
  if(!dem2)return NaN; const u=x/2-.5,v=y/2-.5; if(u<0||v<0||u>=999||v>=999)return NaN;
  const i=u|0,j=v|0,fx=u-i,fy=v-j,a=dem2;
  return ((a[j*1000+i]*(1-fx)+a[j*1000+i+1]*fx)*(1-fy)+(a[(j+1)*1000+i]*(1-fx)+a[(j+1)*1000+i+1]*fx)*fy)/10}
function slopeAt(x,y){const d=3,gx=(zAt(x+d,y)-zAt(x-d,y))/(2*d),gy=(zAt(x,y-d)-zAt(x,y+d))/(2*d);
  const pct=Math.hypot(gx,gy)*100; let asp=(Math.atan2(-gx,-gy)*180/Math.PI+360)%360; return {pct,deg:Math.atan(pct/100)*180/Math.PI,asp}}
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
const dirName=a=>DIRS[Math.round(((a%360)+360)%360/45)%8];
function sunAt(k,x,y){const g=sunGrid[k];if(!g)return NaN;const i=Math.floor(x/4),j=Math.floor(y/4);if(i<0||j<0||i>=500||j>=500)return NaN;return g[j*500+i]/10}

/* ---------------- geometry helpers ---------------- */

  el.innerHTML=`<div class="seg"><button class="btn" id="exGeo">Export GeoJSON</button><button class="btn" id="exKml">Export KML</button></div><p class="hint">KML opens in Google Earth, Avenza and Queensland Globe.</p>`+
   Object.keys(ORDER).filter(g=>groups[g]).map(g=>`<h2>${g} · ${groups[g].length}</h2><div class="flist">${groups[g].sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([id,f])=>`<button data-id="${id}"><i class="swatch" style="background:${(KINDS[f.kind]||KINDS.note).color}"></i><span>${esc(f.name)}</span><span class="meta"><span class="pill ${f.status}">${f.status}</span></span></button>`).join('')}</div>`).join('');
  el.querySelectorAll('.flist button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;zoomTo(features.get(selected));renderFeatures();draw()});
  $('#exGeo').onclick=()=>exportFile('geojson');$('#exKml').onclick=()=>exportFile('kml')}
function zoomTo(f){const g=f.geom;let pts=g.pts||[[g.cx-g.r,g.cy-g.r],[g.cx+g.r,g.cy+g.r]];if(pts.length===1)pts=[[pts[0][0]-40,pts[0][1]-40],[pts[0][0]+40,pts[0][1]+40]];const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);fitBox(Math.min(...xs)-15,Math.min(...ys)-15,Math.max(...xs)+15,Math.max(...ys)+15,60);view.s=Math.min(view.s,6);draw()}
function drawProfile(f){const c=$('#profile');const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
  const d=densify(f.geom.pts,2);const zs=d.map(q=>q.z);const z0=Math.min(...zs),z1=Math.max(...zs)+.01,L=d[d.length-1].d||1;const pad=26,w=r.width-pad-6,h=r.height-22;
  const X=v=>pad+v/L*w,Y=v=>6+(1-(v-z0)/(z1-z0))*h;g.strokeStyle=css('--line');g.lineWidth=1;g.beginPath();g.moveTo(pad,6);g.lineTo(pad,6+h);g.lineTo(pad+w,6+h);g.stroke();
  g.fillStyle=css('--muted');g.font='10px "IBM Plex Mono",monospace';g.textAlign='right';g.fillText(z1.toFixed(0),pad-3,12);g.fillText(z0.toFixed(0),pad-3,6+h);g.textAlign='center';g.fillText(Math.round(L)+' m',pad+w-14,r.height-4);
  g.beginPath();d.forEach((q,i)=>i?g.lineTo(X(q.d),Y(q.z)):g.moveTo(X(q.d),Y(q.z)));g.lineTo(X(L),6+h);g.lineTo(X(0),6+h);g.closePath();g.fillStyle=hexA((KINDS[f.kind]||KINDS.note).color,.2);g.fill();
  g.beginPath();d.forEach((q,i)=>i?g.lineTo(X(q.d),Y(q.z)):g.moveTo(X(q.d),Y(q.z)));g.strokeStyle=(KINDS[f.kind]||KINDS.note).color;g.lineWidth=1.8;g.stroke()}
function geoOf(f){const g=f.geom,ll=q=>xy2ll(q[0],q[1]).map(v=>+v.toFixed(7));
  if(g.g==='point')return {type:'Point',coordinates:ll(g.pts[0])};if(g.g==='line')return {type:'LineString',coordinates:g.pts.map(ll)};if(g.g==='polygon')return {type:'Polygon',coordinates:[g.pts.concat([g.pts[0]]).map(ll)]};
  let a0=g.a0,a1=g.a1;if(g.g==='sun'){const b=sunBearings(KINDS[f.kind].decl);a0=b.set;a1=b.rise}if(a1<=a0)a1+=360;const ring=[[g.cx,g.cy]];for(let a=a0;a<=a1+.01;a+=5){const r=a*Math.PI/180;ring.push([g.cx+Math.sin(r)*g.r,g.cy-Math.cos(r)*g.r])}ring.push([g.cx,g.cy]);return {type:'Polygon',coordinates:[ring.map(ll)]}}
async function exportFile(fmt){const feats=[...features.values()].map(f=>({type:'Feature',properties:{name:f.name,type:(KINDS[f.kind]||{}).label,status:f.status,notes:f.notes},geometry:geoOf(f)}));
  let data,name;if(fmt==='geojson'){data=JSON.stringify({type:'FeatureCollection',features:feats},null,1);name='bright-tree-design.geojson'}
  else{const coords=c=>c.map(p=>p.join(',')+',0').join(' ');const pm=f=>{const g=f.geometry;let geo=g.type==='Point'?`<Point><coordinates>${g.coordinates.join(',')},0</coordinates></Point>`:g.type==='LineString'?`<LineString><tessellate>1</tessellate><coordinates>${coords(g.coordinates)}</coordinates></LineString>`:`<Polygon><outerBoundaryIs><LinearRing><coordinates>${coords(g.coordinates[0])}</coordinates></LinearRing></outerBoundaryIs></Polygon>`;return `<Placemark><name>${esc(f.properties.name)}</name><description>${esc((f.properties.type||'')+' · '+f.properties.status+(f.properties.notes?' · '+f.properties.notes:''))}</description>${geo}</Placemark>`};
    data=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Bright Tree design</name>${feats.map(pm).join('')}</Document></kml>`;name='bright-tree-design.kml'}
  if(downloads){try{await downloads.save({filename:name,data});toast('Saved '+name);return}catch(e){if(e&&e.code==='declined')return}}
  try{await navigator.clipboard.writeText(data);toast('Copied to the clipboard (download not available here)')}catch(e){toast('Export is not available in this view')}}
function renderSite(){const el=$('#tab-site');const m=T.meta;const lot=T.catch[0];const inf=T.catch.slice(1);
  const lc=flat(T.lot);const cx=lc.reduce((s,q)=>s+q[0],0)/lc.length,cy=lc.reduce((s,q)=>s+q[1],0)/lc.length;
  const sl=m.lotSlopeShare;const bar=sl.map(([lo,hi,sh],i)=>{const c=m.slopeClasses[i][2];return `<span style="width:${sh*100}%;background:rgb(${c[0]},${c[1]},${c[2]})" title="${hi?lo+'–'+hi:'>'+lo}%: ${(sh*100).toFixed(0)}%"></span>`}).join('');
  const lotZ=flat(T.lot).map(q=>zAt(...q));
  el.innerHTML=`<h2>Water</h2><dl class="facts"><dt>Whole catchment</dt><dd>${lot.ha} ha drains through the lot</dd><dt>From upstream</dt><dd>${(lot.ha-10).toFixed(1)} ha of neighbours’ land</dd>
   ${inf.map(c=>`<dt>Inflow from ${dirName(bear([cx,cy],c.at))}</dt><dd>${c.ha} ha · enters at ${zAt(...c.at).toFixed(0)} m</dd>`).join('')}
   <dt>Leaves the lot</dt><dd>${m.outlet.ha} ha, north boundary at ${zAt(...m.outlet.at).toFixed(0)} m</dd></dl>
   <p class="hint">At about 1,700 mm a year, every hectare of catchment receives about 17 million litres. The biggest single inflow is the eastern gully.</p>
   <h2>Slope across the lot</h2><div class="bar">${bar}</div><p class="hint">${(sl.slice(0,3).reduce((s,v)=>s+v[2],0)*100).toFixed(0)}% of the lot is under 25%; ${(sl[5][2]*100).toFixed(0)}% is steeper than 50% (27°). Productive ground will be pockets and benches, so the slope layer is the first filter for every placement.</p>
   <h2>Keypoint candidates</h2><p class="hint">Where a gully’s fall flattens sharply, the classic spot to slow and store water. Computed from the LiDAR; check each on the ground.</p>
   <div class="kpl">${T.kp.map((k,i)=>`<button data-i="${i}">KP ${i+1} · ${k.z} m · ${k.ha} ha above<br><small>gully falls ${k.above}% above, ${k.below}% below · ${k.inLot?'inside the lot':'upstream, outside the lot'}</small></button>`).join('')}</div>
   <h2>Sun (terrain only)</h2><dl class="facts"><dt>Winter, 21 Jun</dt><dd>${m.sun_winter_lotmean.toFixed(1)} h average</dd><dt>Equinox</dt><dd>${m.sun_equinox_lotmean.toFixed(1)} h</dd><dt>Summer, 21 Dec</dt><dd>${m.sun_summer_lotmean.toFixed(1)} h</dd></dl>
   <h2>Sources and accuracy</h2><p class="hint">Elevation: Sunshine Coast 2022 LiDAR, 1 m bare-earth DEM (ELVIS), GDA2020 / MGA zone 56. Lot boundary traced from the Department of Resources vegetation report map (10.0 ha title area) and accurate to about 5 m; the surveyed cadastre would tighten it. Catchments and flow lines are computed paths: culverts, road table drains and pipes are not in the LiDAR, so road runoff may go elsewhere than shown. Elevation range on the boundary ${Math.min(...lotZ).toFixed(0)}–${Math.max(...lotZ).toFixed(0)} m.</p>`;
  el.insertAdjacentHTML('beforeend',p3HTML());wireP3(el);
  el.querySelectorAll('.kpl button').forEach(b=>b.onclick=()=>{const k=T.kp[+b.dataset.i];view.cx=k.x;view.cy=k.y;view.s=Math.max(view.s,2.5);layers.kp=true;draw()})}
showTab(lsGet('bt.tab','layers')==='feat'?'layers':lsGet('bt.tab','layers'));
if(matchMedia('(max-width:760px)').matches)$('#panel').classList.add('min');
boot();
</script>
