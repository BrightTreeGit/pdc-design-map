<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#5fbf9f; --accent-ink:#0d1714; --warn:#f08a5d; --ok:#7ccf8d; --mapbg:#202825; color-scheme:dark}}

  --accent:#5fbf9f; --accent-ink:#0d1714; --warn:#f08a5d; --ok:#7ccf8d; --mapbg:#202825; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}

.brand .sub{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.sitesel{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}.sitesel select{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.hdrrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}

.btn.fb{font-size:12.5px;padding:4px 10px;border-color:var(--accent);color:var(--accent);background:transparent}

.tabbody{flex:1;overflow:auto;padding:12px 16px 24px;min-height:0}

.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--chip)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.setup{margin:6px 0 0;padding-left:20px;font-size:13px}.setup li{margin:0 0 10px}.setup li b{display:block;font-weight:600}.setup li.done b{color:var(--muted);font-weight:500}.setup li .hint{display:block;margin:1px 0 4px}.setup .btn{font-size:12px;padding:3px 9px}
.prow .field{flex:1;margin:4px 0}.ptab{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.ptab th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:4px 4px;border-bottom:1px solid var(--line)}.ptab td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}.ptab small{color:var(--muted)}h3.sub{font-size:13px;margin:12px 0 4px;font-weight:600}
#v3d{position:absolute;inset:0;z-index:6;background:#dbe5ec}#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.v3bar.min>*:not(#v3drag):not(#v3min):not(#v3plus){display:none!important}.v3bar.min{resize:none;padding:4px 6px}
.v3bar.compact{font-size:11.5px;gap:4px;padding:4px 6px;max-width:min(330px,calc(100% - 20px))}.v3bar.compact .v3sun{justify-content:flex-start;gap:4px}.v3bar.compact .btn{padding:2px 6px;font-size:11.5px}.v3bar.compact #v3n,.v3bar.compact #v3reset,.v3bar.compact #v3refresh,.v3bar.compact .v3exl,.v3bar.compact #v3info,.v3bar.compact .v3ticks,.v3bar.compact .v3sun>label{display:none!important}.v3bar.compact .v3sun{padding-top:3px}.v3bar.compact .v3tw{width:150px}
.v3bar{resize:horizontal;overflow:auto;min-width:120px}#v3min,#v3plus{min-width:26px;padding:3px 6px}#v3drag{cursor:move;user-select:none;touch-action:none}
.v3bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start;width:max-content;max-width:min(520px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.15);font-size:13px}
.v3bar b{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;padding:0 4px}.v3bar select{font:inherit;padding:3px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}.v3bar .btn{padding:4px 9px}
.v3sun{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.v3tw{display:inline-flex;flex-direction:column;width:min(320px,40vw)}.v3sun input[type=range]{width:100%;margin:0}.v3grad{height:7px;border-radius:4px;margin:1px 8px 0;border:1px solid rgba(0,0,0,.12)}.v3ticks{position:relative;height:14px;margin:0 8px;font:10.5px/1.3 var(--f-mono);color:var(--muted)}.v3ticks span{position:absolute;top:1px;transform:translateX(-50%);white-space:nowrap}.v3sun.off .v3grad,.v3sun.off .v3ticks{opacity:.45}.v3sun.off input,.v3sun.off .v3clock{opacity:.45}.v3clock{font-family:var(--f-mono);font-size:13px;min-width:44px}
.v3info{width:100%;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:0}.v3info:empty{display:none}

.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:2px;display:flex;overflow:hidden;margin:6px 0}

.flist .meta{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.pill{font-size:10.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:9px;background:var(--chip);color:var(--muted)}

.pill.built{background:var(--accent);color:var(--accent-ink)}
.pill.proposed{background:color-mix(in srgb,#d9a227 25%,transparent);color:#a77700}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.field textarea{min-height:80px;resize:vertical}
canvas#profile{width:100%;height:110px;display:block;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--mapbg);overflow:hidden}

.hud{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;font-variant-numeric:tabular-nums;pointer-events:none;max-width:calc(100% - 140px)}
.hud b{font-weight:500;color:var(--ink)} .hud{color:var(--muted)}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;font-size:18px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.drawbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:calc(100% - 80px)}
.drawbar .what{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;padding:0 4px}
.drawbar .gp{display:flex;align-items:center;gap:4px;font-size:12.5px}
.drawbar input[type=number]{width:52px;font:inherit;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.maplegend{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11.5px;max-width:min(260px,calc(100% - 80px));box-shadow:0 2px 10px rgba(0,0,0,.12)}
.maplegend b{display:block;font-family:var(--f-display);font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.maplegend .grad{height:10px;border-radius:2px;margin:2px 0}
.maplegend .ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.maplegend .legend{padding:0}
.toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%}
.toast.show{opacity:1}
.nbform{display:grid;gap:8px;margin-bottom:12px}.nbform textarea{min-height:70px}.nblist{display:grid;gap:10px}
.nb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}.nb.done{opacity:.6}
.nb .nbh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.nb .nbh b{color:var(--ink)}
.nbtag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--hover,rgba(0,0,0,.07));color:var(--ink)}.nbtag.diff{background:#f4d9b8;color:#6b3a00}.nbtag.q{background:#d6e6f7;color:#13406b}.nbtag.dec{background:#d5ecd8;color:#1d5a2a}
.nb .nbt{white-space:pre-wrap;font-size:14px;line-height:1.45}.nb .nbr{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:13px;white-space:pre-wrap}.nb .nbr small{display:block;color:var(--muted);font-size:11px}
.nb .nba{display:flex;gap:6px;flex-wrap:wrap}.nb .nba button{font-size:12px}.zoom button:disabled{opacity:.35;cursor:default}.zoom button[aria-pressed="true"]{background:var(--accent);color:#fff}
.cmenu{position:absolute;z-index:30;background:var(--panel,#fff);color:var(--ink);border:1px solid var(--line,#ccc);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:4px;min-width:190px;font-size:13px}
.cmenu button,.cmenu label{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;padding:7px 10px;border-radius:5px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.cmenu button:hover,.cmenu button:focus-visible{background:var(--hover,rgba(0,0,0,.07));outline:none}.cmenu .cmh{padding:6px 10px 4px;font-weight:600;font-size:12px;color:var(--muted)}.cmenu hr{border:0;border-top:1px solid var(--line,#ddd);margin:4px 0}.cmenu select{flex:1;font:inherit}
.multi{display:grid;gap:8px}.multi .names{font-size:12px;color:var(--muted);max-height:120px;overflow:auto}.lockpill{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--hover,rgba(0,0,0,.08));margin-left:6px}.czbox{margin-top:8px}.czbox>summary{cursor:pointer;font-size:13px;color:var(--accent,#2a7)}.czrow{display:flex;gap:6px;align-items:center}.czrow #czName{flex:1;min-width:0}.czrow input[type=color]{width:40px;height:32px;padding:0;border:none;background:none}.czlist{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}.czlist li{display:flex;align-items:center;gap:6px;font-size:13px}.toast.act{pointer-events:auto;display:flex;gap:10px;align-items:center}.toastbtn{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer}.toastbtn:focus-visible{outline:2px solid var(--accent,#3a7)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.loading[hidden]{display:none}

.grab{display:none}
@media (max-width:760px){
  /* phone: the map fills the screen; the panel is a bottom sheet (peek / half / full) */
  html,body{height:100dvh}
  #app{display:block;height:100dvh;position:relative}
  #mapwrap{position:absolute;inset:0}
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:20;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);height:var(--sheet-h,50dvh);max-height:calc(100dvh - 56px);transition:height .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}

  .brand h1{font-size:17px} .brand .sub{display:none} .sync{margin-top:0}
  .sitesel{margin-top:0;flex:1 1 160px} .hdrrow{margin-top:0}
  .tabbody{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

details.sec{border-bottom:1px solid var(--line);padding:2px 0 8px}

.taskform{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 10px}

details.sec>summary{list-style:none;cursor:pointer;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0 6px;display:flex;align-items:center;gap:8px}

function zAt(x,y){

  return ((a[j*1000+i]*(1-fx)+a[j*1000+i+1]*fx)*(1-fy)+(a[(j+1)*1000+i]*(1-fx)+a[(j+1)*1000+i+1]*fx)*fy)/10}

const dirName=a=>DIRS[Math.round(((a%360)+360)%360/45)%8];

function updUndo(){const u=$('#zUndo'),r=$('#zRedo');if(u){u.disabled=!HIST.length;u.title=HIST.length?'Undo: '+HIST[HIST.length-1].label+' (Ctrl+Z)':'Nothing to undo'}if(r){r.disabled=!REDO.length;r.title=REDO.length?'Redo: '+REDO[REDO.length-1].label+' (Ctrl+Shift+Z)':'Nothing to redo'}}

// keep a live listener alive: if it drops, try again with growing waits; re-arm when the tab wakes or the network returns
const LIVE_SUBS=[];
function keepLive(name,make){const st={name,un:null,tries:0};const go=()=>{try{if(st.un)st.un()}catch(e){}st.un=make(()=>{st.tries=0},err=>{st.tries++;console.warn(name+' sync error',err);setTimeout(go,Math.min(30,2*st.tries)*1000)})};st.go=go;LIVE_SUBS.push(st);go();return st}
async function connect(){

  if(db)keepLive('imagery',(ok,bad)=>db.collection(C('imagery')).onSnapshot(snap=>{ok();const keepLocal=[...imagery.entries()].filter(([k,v])=>v.local);imagery.clear();for(const [k,v] of keepLocal)imagery.set(k,v);
    for(const d of snap.docs){const v=d.data();if(!v||!v.assetId)continue;const cur={...v,src:'/_blob/'+v.assetId};if(align&&align.id===d.id){const mine=imagery.get(d.id);if(mine)continue}imagery.set(d.id,cur);loadImageryEl(d.id,cur)}
    try{if(T&&!(document.activeElement&&document.activeElement.matches('#tab-layers input[type=range]')))renderLayers()}catch(e){console.warn(e)}draw()},bad));
  if(!db){const loc=lsGet('bt.features',{});for(const [k,v] of Object.entries(loc))features.set(k,v);const lt=lsGet('bt.tasks',{});const ll=lsGet('bt.lot',null);if(ll&&ll.pts){lotDoc=ll;applyLot(ll.pts)}for(const [k,v] of Object.entries(lt))tasks.set(k,v);renderPlan();sync.className='sync off';sync.querySelector('span').textContent='Not shared: changes stay in this browser';renderFeatures();draw();return}
  live=true;sync.className='sync on';sync.querySelector('span').textContent='Shared with the team · saves automatically';
  let tries=0,unsub=null;
  const setSync=(on,t,tip)=>{sync.className='sync '+(on?'on':'off');sync.querySelector('span').textContent=t;sync.title=tip||''};
  const sub=()=>{try{if(unsub)unsub()}catch(e){}
    unsub=db.collection(C('features')).onSnapshot(snap=>{if(tries){tries=0;setSync(true,'Shared with the team · saves automatically')}

/* ---------------- aerial imagery: upload, align (similarity transform), share ---------------- */
// image pixel (u,v) -> map (x,y): x = a*u - b*v + c, y = b*u + a*v + d
function imgToWorld(im,u,v){return [im.a*u-im.b*v+im.c,im.b*u+im.a*v+im.d]}
function worldToImg(im,x,y){const k=im.a*im.a+im.b*im.b,dx=x-im.c,dy=y-im.d;return [(im.a*dx+im.b*dy)/k,(-im.b*dx+im.a*dy)/k]}
function loadImageryEl(id,im){if(IMGX[id]&&IMGX[id]._src===im.src)return;const el=new Image();el._src=im.src;el.onload=()=>{draw();try{if(T)renderLayers()}catch(e){console.warn(e)}};el.onerror=()=>console.warn('image did not load',im.name);el.src=im.src;IMGX[id]=el}
function imgSrc(im){return im.assetId?'/_blob/'+im.assetId:im.local||''}
let imgSaveT={};
function saveImageryLater(id){clearTimeout(imgSaveT[id]);imgSaveT[id]=setTimeout(()=>saveImagery(id),500)}
async function saveImagery(id){const im=imagery.get(id);if(!im)return;const body={name:im.name,assetId:im.assetId||null,w:im.w,h:im.h,a:im.a,b:im.b,c:im.c,d:im.d,op:im.op,on:im.on,design:!!im.design,aligned:!!im.aligned,createdBy:im.createdBy||null,createdAt:im.createdAt,updatedAt:new Date().toISOString()};
  if(live&&im.assetId){try{await db.collection(C('imagery')).doc(id).set(body)}catch(e){toast('Image position did not save.')}}}
async function addImage(file,design=false){
  if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Use a PNG, JPEG or WebP image');return}
  const id='img'+Date.now().toString(36);let assetId=null,local=null;
  if(assets){toast('Uploading '+file.name+'…');try{const r=await assets.upload(file);assetId=r.id}catch(e){toast(e&&e.code==='too_large'?'That image is over 20 MB. Export a smaller one.':'Upload failed. Showing it in this browser only.');}}
  if(!assetId)local=URL.createObjectURL(file);
  const el=new Image();el.src=assetId?'/_blob/'+assetId:local;await el.decode().catch(()=>{});
  const w=el.naturalWidth||1000,h=el.naturalHeight||1000;const sc=Math.min(W*0.7/view.s/w,H*0.7/view.s/h);
  const im={name:file.name.replace(/\.[^.]+$/,''),assetId,local,src:assetId?'/_blob/'+assetId:local,w,h,a:sc,b:0,c:view.cx-w*sc/2,d:view.cy-h*sc/2,op:0.85,on:true,design,aligned:false,createdBy:myId,createdAt:new Date().toISOString()};
  imagery.set(id,im);IMGX[id]=el;el._src=im.src;await saveImagery(id);startAlign(id)}
function startAlign(id){cancelDraft();align={id,mode:'pts',pairs:[],step:0};showTab('layers');renderAlignBar();draw()}
function endAlign(){if(align){const im=imagery.get(align.id);if(im){im.aligned=true;saveImagery(align.id)}}align=null;$('#drawbar').hidden=true;cv.classList.remove('drawing');renderLayers();draw()}
function alignClick(w){const im=imagery.get(align.id);if(!im)return;
  if(align.step===0){align.cur={q:worldToImg(im,...w)};align.step=1}
  else{align.cur.w=w;align.pairs.push(align.cur);align.cur=null;align.step=0;
    if(align.pairs.length===1){const p=align.pairs[0];const at=imgToWorld(im,...p.q);im.c+=p.w[0]-at[0];im.d+=p.w[1]-at[1]}
    else{const [p1,p2]=align.pairs.slice(-2);const qx=p2.q[0]-p1.q[0],qy=p2.q[1]-p1.q[1],wx=p2.w[0]-p1.w[0],wy=p2.w[1]-p1.w[1];const k=qx*qx+qy*qy;if(k<1){toast('Pick two points further apart');align.pairs.pop();renderAlignBar();return}
      im.a=(wx*qx+wy*qy)/k;im.b=(wy*qx-wx*qy)/k;im.c=p1.w[0]-(im.a*p1.q[0]-im.b*p1.q[1]);im.d=p1.w[1]-(im.b*p1.q[0]+im.a*p1.q[1]);
      const m=Math.hypot(im.a,im.b);toast(`Aligned: ${(1/m).toFixed(2)} image px per m, rotated ${(Math.atan2(im.b,im.a)*180/Math.PI).toFixed(1)}°`)}
    saveImagery(align.id)}
  renderAlignBar();draw()}
function nudge(scale,rot){const im=imagery.get(align.id);if(!im)return;const cx=im.w/2,cy=im.h/2,ctr=imgToWorld(im,cx,cy);const r=rot*Math.PI/180,ca=Math.cos(r)*scale,sa=Math.sin(r)*scale;const a=im.a*ca-im.b*sa,b=im.a*sa+im.b*ca;im.a=a;im.b=b;const now=imgToWorld(im,cx,cy);im.c+=ctr[0]-now[0];im.d+=ctr[1]-now[1];saveImageryLater(align.id);draw()}
function renderAlignBar(){const b=$('#drawbar');const im=imagery.get(align.id);if(!im){endAlign();return}b.hidden=false;cv.classList.add('drawing');
  const n=align.pairs.length;const help=align.mode==='move'?'Drag the image into place':align.step===0?`Point ${n%2+1} of 2: click a feature on the image (a lot corner, road bend, building)`:'Now click where that feature really is on the terrain';
  b.innerHTML=`<span class="what">Align ${esc(im.name)}</span><span class="hint">${help}</span>
   <div class="seg"><button aria-pressed="${align.mode==='pts'}" id="amPts">Match points</button><button aria-pressed="${align.mode==='move'}" id="amMove">Drag</button></div>
   <button class="btn" id="aSm" title="Smaller">−</button><button class="btn" id="aSp" title="Larger">+</button><button class="btn" id="aRl" title="Rotate left">⟲</button><button class="btn" id="aRr" title="Rotate right">⟳</button>
   <button class="btn primary" id="aDone">Done</button>`;
  $('#amPts').onclick=()=>{align.mode='pts';align.step=0;renderAlignBar()};$('#amMove').onclick=()=>{align.mode='move';renderAlignBar()};
  $('#aSm').onclick=()=>nudge(1/1.02,0);$('#aSp').onclick=()=>nudge(1.02,0);$('#aRl').onclick=()=>nudge(1,-0.5);$('#aRr').onclick=()=>nudge(1,0.5);$('#aDone').onclick=endAlign}

function paddockCalc(f){const a=polyArea(f.geom.pts)/1e4,q=PQ[f.pq||'fair'],an=ANIMALS[GZ.animal];const need=Math.max(.1,(+GZ.n||0)*an[1]);

function headCalc(a,b){const za=zAt(...a),zb=zAt(...b),L=dist(a,b),dz=za-zb,kpa=9.81*Math.abs(dz);const d=densify([a,b],1);let S=0;for(let i=1;i<d.length;i++)S+=Math.hypot(d[i].d-d[i-1].d,(d[i].z-d[i-1].z)||0);return {za,zb,L,S:S||L,dz,kpa,grade:Math.abs(dz)/L*100}}
/* ---------------- micro-hydro: intake on a creek, penstock down to a turbine; flow from rainfall x catchment ---------------- */
let HY=Object.assign({share:50,eff:55,qd:0,avail:90,price:0.30},lsGet('bt.hydro',{}));let HYACC=null;
function hyAcc(){if(HYACC)return HYACC;if(!EXTRA||!EXTRA.d8)return null;const N=1000,d8=EXTRA.d8,NN=N*N;const DR=[-1,-1,-1,0,0,1,1,1],DC=[-1,0,1,-1,1,-1,0,1];
  const rec=new Int32Array(NN).fill(-1),indeg=new Uint8Array(NN);for(let i=0;i<NN;i++){const k=d8[i];if(k<8){const r=((i/N)|0)+DR[k],c=i%N+DC[k];if(r>=0&&r<N&&c>=0&&c<N){rec[i]=r*N+c;indeg[r*N+c]++}}}
  const order=new Int32Array(NN);let h=0,t=0;for(let i=0;i<NN;i++)if(!indeg[i])order[t++]=i;const acc=new Float32Array(NN).fill(4);while(h<t){const i=order[h++],j=rec[i];if(j>=0){acc[j]+=acc[i];if(--indeg[j]===0)order[t++]=j}}
  HYACC=acc;return acc}
function hySnap(w){const acc=hyAcc();if(!acc)return {p:w,A:0};const c0=Math.round(w[0]/2-.5),r0=Math.round(w[1]/2-.5);let best=-1,bp=null;
  for(let dr=-6;dr<=6;dr++)for(let dc=-6;dc<=6;dc++){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=1000||c>=1000||dr*dr+dc*dc>36)continue;const a=acc[r*1000+c];if(a>best){best=a;bp=[c*2+1,r*2+1]}}return {p:bp?r1(bp):w,A:best}}
const HYPIPE=[[40,34],[50,42.6],[63,53.6],[75,63.8],[90,76.6],[110,93.8],[125,106.6],[160,136.4]];
const HYPIPE_COST={40:6,50:9,63:13,75:18,90:26,110:38,125:48,160:78};
const HYPN=[[6.3,60,.6],[8,78,.7],[10,98,.85],[12.5,122,1],[16,157,1.25],[20,196,1.5]];
function hyFric(Lps,L,idmm){const Q=Lps/1000,D=idmm/1000;return 10.67*L*Math.pow(Q,1.852)/(Math.pow(150,1.852)*Math.pow(D,4.87))*1.15}
function hydroCalc(a,b){const za=zAt(...a),zb=zAt(...b);if(!isFinite(za)||!isFinite(zb))return {err:'Both points must be on the map.'};const H=za-zb;if(H<=0)return {err:'The intake (first click) must be higher than the turbine (second click).'};
  const sn=hySnap(a);const A=sn.A;const d=densify([a,b],2);let S=0;for(let i=1;i<d.length;i++)S+=Math.hypot(d[i].d-d[i-1].d,(d[i].z-d[i-1].z)||0);const L=Math.ceil((S||dist(a,b))*1.1/5)*5;
  const rain=RAIN.median||RAIN.mean;const mx=Math.max(...RAIN.mean);
  const months=rain.map((r,i)=>{const C=.15+.25*Math.min(1,RAIN.mean[i]/Math.max(150,mx*.8));const Qc=r/1000*A*C/(MDAYS[i]*86400)*1000;return {m:i,Qc,use:Qc*HY.share/100}});
  const srt=months.map(x=>x.use).sort((p,q)=>p-q);const Qd=HY.qd>0?HY.qd:Math.max(.2,srt[3]);
  let pipe=HYPIPE[HYPIPE.length-1];for(const p of HYPIPE){if(hyFric(Qd,L,p[1])<=.12*H){pipe=p;break}}
  const pn=HYPN.find(x=>H<=x[1]);const hf=hyFric(Qd,L,pipe[1]);const Hn=H-hf;const eff=HY.eff/100;
  const P=9.81*Qd/1000*Hn*eff;// kW
  months.forEach(x=>{const q=Math.min(Qd,x.use);const hn=H-hyFric(q,L,pipe[1]);x.kw=Math.max(0,9.81*q/1000*hn*eff);x.kwh=x.kw*24*MDAYS[x.m]*HY.avail/100});
  const year=months.reduce((s,x)=>s+x.kwh,0);
  // cost (AUD, rough 2026): pipe, intake, turbine, controls, cable to the nearest building, labour
  let near=null,nd=1e9;for(const f of features.values()){if(ROOF_KINDS.includes(f.kind)&&f.geom.g==='polygon'){const c=centroid(f);const dd=dist(c,b);if(dd<nd){nd=dd;near=f}}}if(!near)nd=100;
  const pipeCost=L*(HYPIPE_COST[pipe[0]]*(pn?pn[2]:1.8)*1.15+8);const turbine=4000+2800*Math.max(.3,P);const ctrl=1500+500*Math.max(.3,P);const intake=2500,house=1500;
  const cable=nd*(P>3?40:25);const elec=3000;const labour=.2*(pipeCost+turbine+ctrl+intake+house);
  const items=[['Penstock: '+L+' m of '+pipe[0]+' mm HDPE '+(pn?'PN'+pn[0]:'(too high for HDPE: steel, or break-pressure stages)')+', fittings, anchors and laying',pipeCost],['Intake: small weir, screen and silt trap',intake],[(H>30?'Pelton or Turgo':'Turgo or cross-flow')+' turbine and generator ('+P.toFixed(P<1?2:1)+' kW)',turbine],['Controller, dump load and battery or inverter interface',ctrl],['Powerhouse shed and slab',house],['Cable to '+(near?(near.name||'the nearest building'):'the house (assumed 100 m)')+', '+Math.round(nd)+' m in conduit',cable],['Electrician: connection and commissioning',elec],['Installation labour (about 20%)',labour]];
  const total=items.reduce((s,x)=>s+x[1],0);

/* ---------------- pipe friction: gravity feed through HDPE pipe and fittings ---------------- */
// PE100 PN12.5 (SDR 13.6) inside diameters; Hazen-Williams C = 150 for new polyethylene
const PIPES={'63':{label:'2-inch (63 mm)',id:53.6},'50':{label:'1½-inch (50 mm)',id:42.6},'40':{label:'1¼-inch (40 mm)',id:34.0},'32':{label:'1-inch (32 mm)',id:27.2}};
const PIPE=Object.assign({size:'63',len:0,elb:4,tee:2,val:2},lsGet('bt.pipe',{}));
// loss coefficients (K) for compression/poly fittings, which have a reduced bore and lose more than smooth bends
const FITK={entry:0.5,elb:1.2,tee:1.8,val:0.3,join:0.4};
const FLOWS=[[10,'One tap or a shower'],[20,'A garden hose'],[40,'Two sprinklers, or hose and shower together'],[60,'Filling a tank or a fire hose']];
function pipeLen(r){return PIPE.len>0?PIPE.len:Math.ceil(r.S*1.1/5)*5}
function pipeLoss(Lpm,r){const D=PIPES[PIPE.size].id/1000,Q=Lpm/60000,L=pipeLen(r),A=Math.PI*D*D/4,v=Q/A;
  const hfPipe=10.67*L*Math.pow(Q,1.852)/(Math.pow(150,1.852)*Math.pow(D,4.87));
  const K=FITK.entry+PIPE.elb*FITK.elb+PIPE.tee*FITK.tee+PIPE.val*FITK.val+Math.floor(L/50)*FITK.join; // a joiner every 50 m roll
  const hfFit=K*v*v/19.62;return {v,hfPipe,hfFit,hf:hfPipe+hfFit,K,L}}
function maxFlowAt(r,minKpa){const head=Math.abs(r.dz)-minKpa/9.81;if(head<=0)return 0;let lo=0,hi=600;for(let i=0;i<40;i++){const m=(lo+hi)/2;if(pipeLoss(m,r).hf<head)lo=m;else hi=m}return lo}
function pipeHTML(r){if(!r)return '';const st=r.kpa;const L=pipeLen(r);const lp=pipeLoss(40,r);const kp=x=>{const v=9.81*x;return v<1?v.toFixed(1):Math.round(v)};
  const rows=FLOWS.map(([q,use])=>{const p=pipeLoss(q,r),res=Math.max(0,st-9.81*p.hf);const fast=p.v>1.5;
    return `<tr><td>${q} L/min<br><small>${use}</small></td><td>${kp(p.hf)} kPa</td><td><b>${Math.round(res)} kPa</b><br><small>${(res/100).toFixed(1)} bar</small></td><td><small>${p.v.toFixed(1)} m/s${fast?' · fast: water hammer risk, use bigger pipe':''}</small></td></tr>`}).join('');
  const q150=maxFlowAt(r,150),q50=maxFlowAt(r,50);
  return `<h3 class="sub">Static (no water flowing)</h3><p class="hint"><b>${Math.round(st)} kPa</b> (${(st/100).toFixed(2)} bar, ${Math.round(st*0.145)} psi) from ${Math.abs(r.dz).toFixed(1)} m of fall. This is what a gauge reads with every tap shut, before any friction. ${pressureMeaning(st)}</p>
   <h3 class="sub">While water flows, through ${PIPES[PIPE.size].label} HDPE</h3>
   <div class="row prow"><div class="field"><label for="ppSize">Pipe</label><select id="ppSize">${Object.entries(PIPES).map(([k,v])=>`<option value="${k}" ${PIPE.size===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
   <div class="field"><label for="ppLen">Pipe length (m)</label><input id="ppLen" type="number" min="0" step="5" value="${PIPE.len||''}" placeholder="${L}"></div></div>
   <div class="row prow"><div class="field"><label for="ppElb">Elbows</label><input id="ppElb" type="number" min="0" max="50" value="${PIPE.elb}"></div><div class="field"><label for="ppTee">Tees</label><input id="ppTee" type="number" min="0" max="50" value="${PIPE.tee}"></div><div class="field"><label for="ppVal">Valves</label><input id="ppVal" type="number" min="0" max="20" value="${PIPE.val}"></div></div>
   <table class="ptab"><thead><tr><th>Flow</th><th>Lost to friction</th><th>Left at the outlet</th><th>Speed</th></tr></thead><tbody>${rows}</tbody></table>
   <p class="hint">${PIPE.len?'':`Length assumed ${L} m: the slope distance plus 10% for the route. `}Fittings (tank outlet, ${PIPE.elb} elbows, ${PIPE.tee} tees, ${PIPE.val} valves${Math.floor(L/50)?`, ${Math.floor(L/50)} joiners`:''}) cost about ${kp(lp.hfFit)} kPa at 40 L/min, ${lp.hf>0?Math.round(lp.hfFit/lp.hf*100):0}% of the friction; the pipe itself loses ${kp(lp.hfPipe)} kPa.</p>
   <p class="hint">${q150>=1?`You can draw about <b>${Math.round(q150)} L/min</b> and still have 150 kPa at the outlet (enough for most gas hot water and sprinklers)${q50>=1?`, or ${Math.round(q50)} L/min at 50 kPa (gravity drip)`:''}.${(()=>{const D=PIPES[PIPE.size].id/1000,qv=1.5*Math.PI*D*D/4*60000;return q150>qv?` Above about ${Math.round(qv/10)*10} L/min the water moves faster than 1.5 m/s, so close valves slowly to avoid water hammer.`:''})()}`:`This fall can’t reach 150 kPa at the outlet, even with the taps shut: you’d need about ${Math.ceil(15.3-Math.abs(r.dz))} m more height, or a pressure pump.${q50>=1?` At 50 kPa (gravity drip) you can draw about <b>${Math.round(q50)} L/min</b>.`:''}`}</p>
   <p class="hint">Estimate only: inside diameters are for PE100 PN12.5 pipe (check the print on the pipe), Hazen-Williams C 150, compression fittings. Old pipe, filters, meters and hot water units take extra pressure.</p>`}
function wirePipe(el){const box=el.querySelector('#headRes');if(!box)return;const up=()=>{lsSet('bt.pipe',PIPE);const r=mt&&mt.type==='measure'?mt.res:null;const f=document.activeElement&&document.activeElement.id;box.innerHTML=pipeHTML(r);wirePipe(el);if(f&&$('#'+f)){const e=$('#'+f);e.focus();if(e.setSelectionRange&&e.type==='text')e.setSelectionRange(e.value.length,e.value.length)}renderMTBar()};
  const n=(id,k,mx)=>{const e=box.querySelector(id);if(e)e.onchange=()=>{PIPE[k]=Math.max(0,Math.min(mx,Math.round(+e.value||0)));up()}};
  const s=box.querySelector('#ppSize');if(s)s.onchange=()=>{PIPE.size=s.value;up()};
  n('#ppLen','len',20000);n('#ppElb','elb',50);n('#ppTee','tee',50);n('#ppVal','val',20)}

function v3AutoBearing(){const P=flat(T.lot);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;P.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});let sx=0,sy=0;
  for(let x=x0;x<=x1;x+=8)for(let y=y0;y<=y1;y+=8){if(!inPoly([x,y],P))continue;const s=slopeAt(x,y);if(!s||!isFinite(s.asp))continue;const w=Math.min(s.pct,80);sx+=Math.sin(s.asp*Math.PI/180)*w;sy+=Math.cos(s.asp*Math.PI/180)*w}
  return sx||sy?((Math.atan2(sx,sy)*180/Math.PI)+360)%360:135}

  sh.forEach(([lo,hi,v],i)=>{const ww=v*w;const c=cl[i][2];g.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},.95)`;g.fillRect(cx,y+h,ww,34);if(ww>58)shText(g,Math.round(v*100)+'%',cx+ww/2,y+h+25,20,'#fff',600,'center');cx+=ww});

  for(const [t,c] of lab){g.font='400 18px "IBM Plex Sans",sans-serif';const tw=g.measureText(t).width+44;if(lx+tw>x+w){lx=x;ly+=28}g.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;g.fillRect(lx,ly,16,16);shText(g,t,lx+22,ly+15,18,SC.mute);lx+=tw}

  el.innerHTML=setupHTML()+sitesHTML()+`<h2>Water</h2><dl class="facts"><dt>Whole catchment</dt><dd>${m.catchEdge?'at least ':''}${lot.ha} ha drains through the lot${m.catchEdge?' (it runs past the edge of the map, so the true figure is larger)':''}</dd><dt>From upstream</dt><dd>${Math.max(0,lot.ha-lotHa).toFixed(1)} ha of neighbours’ land</dd>
   ${inf.map(c=>`<dt>Inflow from ${dirName(bear([cx,cy],c.at))}</dt><dd>${c.ha} ha · enters at ${zAt(...c.at).toFixed(0)} m</dd>`).join('')}
   ${m.outlet?`<dt>Leaves the lot</dt><dd>${m.outlet.ha} ha, ${dirName(bear([cx,cy],m.outlet.at))} boundary at ${zAt(...m.outlet.at).toFixed(0)} m</dd>`:''}</dl>
   <p class="hint">At about ${(Math.round(annual/50)*50).toLocaleString()} mm a year, every hectare of catchment receives about ${(annual/100).toFixed(0)} million litres.${big?` The biggest single inflow comes from the ${DL[dirName(bear([cx,cy],big.at))]} (${big.ha} ha).`:''}</p>
   <h2>Slope across the lot</h2><div class="bar">${bar}</div><p class="hint">${(sl.slice(0,3).reduce((s,v)=>s+v[2],0)*100).toFixed(0)}% of the lot is under 25%; ${(sl[5][2]*100).toFixed(0)}% is steeper than 50% (27°). ${sl[5][2]>.4?'Productive ground will be pockets and benches, so the slope':'The slope'} layer is the first filter for every placement.</p>
   <h2>Keypoint candidates</h2><p class="hint">Where a gully’s fall flattens sharply, the classic spot to slow and store water. Computed from the LiDAR; check each on the ground.</p>
   <div class="kpl">${T.kp.map((k,i)=>`<button data-i="${i}">KP ${i+1} · ${k.z} m · ${k.ha} ha above<br><small>gully falls ${k.above}% above, ${k.below}% below · ${k.inLot?'inside the lot':'upstream, outside the lot'}</small></button>`).join('')}</div>
   <h2>Sun (terrain only)</h2><dl class="facts"><dt>Winter, 21 Jun</dt><dd>${m.sun_winter_lotmean.toFixed(1)} h average</dd><dt>Equinox</dt><dd>${m.sun_equinox_lotmean.toFixed(1)} h</dd><dt>Summer, 21 Dec</dt><dd>${m.sun_summer_lotmean.toFixed(1)} h</dd></dl>
   ${soilSiteHTML()}
   <h2>Climate</h2>${climateSVG()}<p class="hint">${RAIN.station}, ${RAIN.period}. Bars are average monthly rain (darker: the typical, median month). ${MON[wet]} is the wettest month and ${MON[dry]} the driest. The coldest month's mean minimum is ${coldM} °C at the station, and cold air pools in valley floors, so frost comes earlier and harder there on still, clear nights.</p>
   <h2>Sources and accuracy</h2><p class="hint">${IMG.aerial?`Aerial base: ${SITE.state==='NSW'?'NSW Spatial Services imagery':'Queensland Government “Latest State Program” imagery'} (CC BY 4.0), fetched for the map’s 2 km square so it lines up without alignment. `:''}Elevation: ${esc(SITE.source||('LiDAR '+SITE.main+', '+SITE.res+' bare-earth DEM (ELVIS)'))}, GDA2020 / MGA zone ${ZONE}. ${esc(SITE.boundaryNote||'Lot boundary is approximate: check it against the title plan and fix it under Set-up above.')} Catchments and flow lines are computed paths: culverts, road table drains and pipes are not in the LiDAR, so road runoff may go elsewhere than shown. Elevation range on the boundary ${Math.min(...lotZ).toFixed(0)}–${Math.max(...lotZ).toFixed(0)} m.</p>`;
  wireSetup(el);wireSecs(el);
  el.querySelectorAll('.kpl button').forEach(b=>b.onclick=()=>{const k=T.kp[+b.dataset.i];view.cx=k.x;view.cy=k.y;view.s=Math.max(view.s,2.5);layers.kp=true;draw()})}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='govAer'){setLayer('base',e.target.checked?'aerial':'relief');renderLayers()}});
showTab(lsGet('bt.tab','layers')==='feat'?'layers':lsGet('bt.tab','layers'));
if(isPhone())setSheet('peek');
boot();
